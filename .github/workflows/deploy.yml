# Сборка и публикация на GitHub Pages при каждом изменении в main
# (в том числе после сохранения в админке Pages CMS).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # base_path: "/<repo>" для адреса username.github.io/<repo>, пустой — когда подключён свой домен
      - id: pages
        uses: actions/configure-pages@v5

      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - run: npm ci

      # сжатые версии загруженных видео/фото — чтобы не перекодировать каждый раз
      - uses: actions/cache@v4
        with:
          path: .media-cache
          key: media-${{ hashFiles('public/media/video/**', 'public/media/img/**', 'public/media/posters/**') }}
          restore-keys: media-

      - name: Optimize uploaded media
        run: node scripts/optimize-media.mjs

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # свой домен можно задать в Settings → Secrets and variables → Actions → Variables → SITE_URL
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}

      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
